<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="Pretendard">
  <rect x="1" y="1" width="638" height="428" rx="20" fill="#ffffff" stroke="#e5e8eb" stroke-width="2"/>
  <text x="32" y="52" font-size="25" font-weight="800" fill="#191f28" letter-spacing="-0.5">전세 복비, 6억 원에서 한 번 뜁니다</text>
  <text x="32" y="82" font-size="17" font-weight="500" fill="#8b95a1">전세 보증금별 중개보수 상한 (한쪽 기준, 부가세 별도)</text>

  <!-- 바닥 y=340, 1만 원 = 0.6px -->
  <line x1="50" y1="340" x2="610" y2="340" stroke="#c9d1d9" stroke-width="2"/>
  <g>
    <rect x="70"  y="322" width="60" height="18"  rx="5" fill="#c7d2fe"/>
    <rect x="150" y="286" width="60" height="54"  rx="5" fill="#c7d2fe"/>
    <rect x="230" y="250" width="60" height="90"  rx="5" fill="#c7d2fe"/>
    <rect x="310" y="234" width="60" height="106" rx="5" fill="#a5b4fc"/>
    <rect x="390" y="196" width="60" height="144" rx="5" fill="#4338ca"/>
    <rect x="470" y="148" width="60" height="192" rx="5" fill="#4338ca"/>
  </g>
  <g font-size="16" font-weight="800" fill="#3730a3" text-anchor="middle">
    <text x="100" y="312">30만</text>
    <text x="180" y="276">90만</text>
    <text x="260" y="240">150만</text>
    <text x="340" y="224">177만</text>
    <text x="420" y="186">240만</text>
    <text x="500" y="138">320만</text>
  </g>
  <g font-size="15" font-weight="600" fill="#4e5968" text-anchor="middle">
    <text x="100" y="364">1억</text>
    <text x="180" y="364">3억</text>
    <text x="260" y="364">5억</text>
    <text x="340" y="364">5.9억</text>
    <text x="420" y="364">6억</text>
    <text x="500" y="364">8억</text>
  </g>
  <text x="240" y="150" font-size="16" font-weight="800" fill="#be123c" text-anchor="middle">6억부터 0.3% → 0.4%</text>
  <text x="240" y="172" font-size="15" font-weight="600" fill="#be123c" text-anchor="middle">1천만 원 차이에 +63만 원</text>

  <text x="32" y="400" font-size="15" font-weight="500" fill="#8b95a1">1억~6억 미만 0.3%, 6억~12억 미만 0.4% · 상한일 뿐, 협의로 낮출 수 있습니다</text>
</svg>
