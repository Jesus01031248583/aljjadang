<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Pretendard">
  <rect x="1" y="1" width="638" height="398" rx="20" fill="#ffffff" stroke="#e5e8eb" stroke-width="2"/>
  <text x="32" y="52" font-size="25" font-weight="800" fill="#191f28" letter-spacing="-0.5">개인 일반과세자 부가세 1년 일정</text>
  <text x="32" y="82" font-size="17" font-weight="500" fill="#8b95a1">1년을 두 번(1기·2기)으로 나눠 신고합니다</text>

  <!-- 과세기간 띠: 한 달 = 44px, 1월 시작 x=34 -->
  <rect x="34" y="112" width="262" height="40" rx="8" fill="#e0e7ff"/>
  <text x="165" y="138" font-size="18" font-weight="700" fill="#3730a3" text-anchor="middle">1기 · 1~6월</text>
  <rect x="300" y="112" width="262" height="40" rx="8" fill="#c7d2fe"/>
  <text x="431" y="138" font-size="18" font-weight="700" fill="#3730a3" text-anchor="middle">2기 · 7~12월</text>

  <!-- 달력 눈금 -->
  <g font-size="15" font-weight="500" fill="#8b95a1" text-anchor="middle">
    <text x="56" y="182">1</text><text x="100" y="182">2</text><text x="144" y="182">3</text><text x="188" y="182">4</text>
    <text x="232" y="182">5</text><text x="276" y="182">6</text><text x="320" y="182">7</text><text x="364" y="182">8</text>
    <text x="408" y="182">9</text><text x="452" y="182">10</text><text x="496" y="182">11</text><text x="540" y="182">12</text>
    <text x="584" y="182" font-weight="700" fill="#4338ca">1월</text>
  </g>
  <line x1="34" y1="196" x2="606" y2="196" stroke="#c9d1d9" stroke-width="2"/>

  <!-- 할 일 표시 -->
  <g stroke-width="2">
    <line x1="188" y1="196" x2="188" y2="226" stroke="#a5b4fc"/>
    <line x1="320" y1="196" x2="320" y2="290" stroke="#4338ca"/>
    <line x1="452" y1="196" x2="452" y2="226" stroke="#a5b4fc"/>
    <line x1="584" y1="196" x2="584" y2="290" stroke="#4338ca"/>
  </g>
  <circle cx="188" cy="196" r="7" fill="#a5b4fc"/>
  <circle cx="320" cy="196" r="7" fill="#4338ca"/>
  <circle cx="452" cy="196" r="7" fill="#a5b4fc"/>
  <circle cx="584" cy="196" r="7" fill="#4338ca"/>

  <g font-size="16" text-anchor="middle">
    <text x="188" y="250" font-weight="700" fill="#191f28">4월</text>
    <text x="188" y="272" font-weight="500" fill="#4e5968">예정고지 납부</text>
    <text x="452" y="250" font-weight="700" fill="#191f28">10월</text>
    <text x="452" y="272" font-weight="500" fill="#4e5968">예정고지 납부</text>
    <text x="320" y="314" font-weight="700" fill="#191f28">7월 25일</text>
    <text x="320" y="336" font-weight="500" fill="#4e5968">1기 확정신고·납부</text>
    <text x="566" y="314" font-weight="700" fill="#191f28">다음 해 1월 25일</text>
    <text x="566" y="336" font-weight="500" fill="#4e5968">2기 확정신고·납부</text>
  </g>

  <text x="32" y="378" font-size="15" font-weight="500" fill="#8b95a1">기한이 주말·공휴일이면 다음 영업일까지 · 예정고지는 직전 납부세액의 절반</text>
</svg>
