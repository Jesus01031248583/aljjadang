<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="Pretendard">
  <rect x="1" y="1" width="638" height="468" rx="20" fill="#ffffff" stroke="#e5e8eb" stroke-width="2"/>
  <text x="32" y="52" font-size="25" font-weight="800" fill="#191f28" letter-spacing="-0.5">남은 두 달, 결제 수단 고르는 순서</text>
  <text x="32" y="82" font-size="17" font-weight="500" fill="#8b95a1">카드사 앱이나 홈택스에서 올해 사용액부터 확인하세요</text>

  <!-- 질문 1 -->
  <rect x="32" y="108" width="576" height="56" rx="14" fill="#f2f4f6"/>
  <text x="320" y="143" font-size="19" font-weight="700" fill="#191f28" text-anchor="middle">올해 카드 사용액이 총급여의 25%를 넘었나요?</text>

  <path d="M170 164v26M470 164v26" stroke="#c9d1d9" stroke-width="2"/>
  <text x="182" y="184" font-size="15" font-weight="700" fill="#8b95a1">아니요</text>
  <text x="482" y="184" font-size="15" font-weight="700" fill="#8b95a1">예</text>

  <!-- 아니요 -->
  <rect x="32" y="196" width="276" height="128" rx="14" fill="#e0e7ff"/>
  <text x="170" y="232" font-size="19" font-weight="800" fill="#3730a3" text-anchor="middle">신용카드로 25%까지</text>
  <text x="170" y="262" font-size="16" font-weight="500" fill="#4e5968" text-anchor="middle">25%까지는 공제가 0원이라</text>
  <text x="170" y="286" font-size="16" font-weight="500" fill="#4e5968" text-anchor="middle">할인·적립 혜택을 챙기고</text>
  <text x="170" y="310" font-size="16" font-weight="500" fill="#4e5968" text-anchor="middle">넘는 순간 체크카드로</text>

  <!-- 예 -->
  <rect x="332" y="196" width="276" height="56" rx="14" fill="#f2f4f6"/>
  <text x="470" y="230" font-size="18" font-weight="700" fill="#191f28" text-anchor="middle">공제 한도를 다 채웠나요?</text>
  <path d="M400 252v24M540 252v24" stroke="#c9d1d9" stroke-width="2"/>
  <text x="410" y="270" font-size="15" font-weight="700" fill="#8b95a1">아니요</text>
  <text x="550" y="270" font-size="15" font-weight="700" fill="#8b95a1">예</text>

  <rect x="332" y="282" width="134" height="104" rx="14" fill="#d1fae5"/>
  <text x="399" y="316" font-size="18" font-weight="800" fill="#065f46" text-anchor="middle">체크카드</text>
  <text x="399" y="340" font-size="18" font-weight="800" fill="#065f46" text-anchor="middle">현금영수증</text>
  <text x="399" y="368" font-size="15" font-weight="500" fill="#4e5968" text-anchor="middle">공제율 30%</text>

  <rect x="474" y="282" width="134" height="104" rx="14" fill="#fef3c7"/>
  <text x="541" y="316" font-size="18" font-weight="800" fill="#92400e" text-anchor="middle">혜택 좋은</text>
  <text x="541" y="340" font-size="18" font-weight="800" fill="#92400e" text-anchor="middle">카드 아무거나</text>
  <text x="541" y="368" font-size="15" font-weight="500" fill="#4e5968" text-anchor="middle">더 써도 공제 그대로</text>

  <text x="32" y="420" font-size="15" font-weight="500" fill="#8b95a1">전통시장·대중교통은 결제 수단과 관계없이 공제율 40%입니다</text>
  <text x="32" y="444" font-size="15" font-weight="500" fill="#8b95a1">총급여 = 연봉에서 식대 같은 비과세 소득을 뺀 금액</text>
</svg>
