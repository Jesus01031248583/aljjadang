<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Pretendard">
  <rect x="1" y="1" width="638" height="398" rx="20" fill="#ffffff" stroke="#e5e8eb" stroke-width="2"/>
  <text x="32" y="52" font-size="25" font-weight="800" fill="#191f28" letter-spacing="-0.5">청약통장 월 납입액별 절세 효과</text>
  <text x="32" y="82" font-size="17" font-weight="500" fill="#8b95a1">무주택 세대주 · 총급여 7천만 원 이하 · 세율 16.5% 가정</text>

  <!-- 1만 원 = 20px, 시작 x=150 -->
  <g font-size="17" font-weight="700" fill="#191f28" text-anchor="end">
    <text x="130" y="138">월 10만 원</text>
    <text x="130" y="198">월 20만 원</text>
    <text x="130" y="258">월 25만 원</text>
    <text x="130" y="318">월 30만 원</text>
  </g>
  <rect x="150" y="114" width="158" height="34" rx="6" fill="#c7d2fe"/>
  <rect x="150" y="174" width="316" height="34" rx="6" fill="#818cf8"/>
  <rect x="150" y="234" width="396" height="34" rx="6" fill="#4338ca"/>
  <rect x="150" y="294" width="396" height="34" rx="6" fill="#c9d1d9"/>
  <g font-size="16" font-weight="800">
    <text x="320" y="137" fill="#3730a3">약 7만 9천 원</text>
    <text x="478" y="197" fill="#3730a3">약 15만 8천 원</text>
    <text x="534" y="257" fill="#ffffff" text-anchor="end">약 19만 8천 원</text>
    <text x="534" y="317" fill="#4e5968" text-anchor="end">19만 8천 원 (한도)</text>
  </g>

  <text x="32" y="362" font-size="16" font-weight="700" fill="#191f28">연 납입액(최대 300만 원) × 40% = 소득공제 → × 내 세율 = 줄어드는 세금</text>
  <text x="32" y="386" font-size="14" font-weight="500" fill="#8b95a1">월 25만 원(연 300만 원)을 넘게 넣어도 소득공제는 늘지 않습니다</text>
</svg>
