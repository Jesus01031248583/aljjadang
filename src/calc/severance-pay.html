<form class="calc-form" autocomplete="off">
  <div class="field-row">
    <div class="field">
      <label for="f-start">입사일</label>
      <input class="date" id="f-start" name="start" type="date" value="2021-03-02">
    </div>
    <div class="field">
      <label for="f-end">퇴직일</label>
      <input class="date" id="f-end" name="end" type="date" value="2026-10-31">
    </div>
  </div>
  <p class="hint">퇴직일은 마지막으로 근무한 날의 다음 날이에요. 10월 30일까지 일했다면 10월 31일을 넣으세요.</p>
  <div class="field">
    <label for="f-wage3">퇴직 전 3개월 임금 총액 (세전)</label>
    <div class="input"><input id="f-wage3" name="wage3" data-money inputmode="numeric" value="10500000"><span>원</span></div>
    <p class="hint" data-hint-for="wage3"></p>
    <p class="hint">기본급과 매달 받는 수당을 모두 더한 세전 금액이에요. 월급이 350만 원이면 1,050만 원을 넣으세요.</p>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="f-bonus">1년간 받은 상여금</label>
      <div class="input"><input id="f-bonus" name="bonus" data-money inputmode="numeric" value="0"><span>원</span></div>
    </div>
    <div class="field">
      <label for="f-leave">1년간 받은 연차수당</label>
      <div class="input"><input id="f-leave" name="leave" data-money inputmode="numeric" value="0"><span>원</span></div>
    </div>
  </div>
</form>
<div class="calc-result" aria-live="polite"></div>
<button type="button" class="calc-share" data-share>결과 링크 공유</button>
